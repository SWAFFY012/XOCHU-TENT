# Автодеплой на Hostland: при каждом изменении в main сайт собирается
# (Next.js, output: "standalone") и по FTP выгружается в каталог Node.js-приложения.
#
# Нужны:
#   секреты репозитория  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD;
#   переменная репозитория HOSTLAND_APP_DIR — каталог приложения от корня FTP,
#   сейчас ./xn----jtbybvccot.xn--p1ai/projects/xochu-tent/ (со слешем в конце).
# В панели Hostland стартовый файл приложения — server.js.
#
# Выгружается собранная папка .next/standalone (server.js, next-server.js, node_modules, .next, public, data).
# Файлы, которых нет в сборке (.env с токеном Telegram, логи), на сервере не трогаются:
# действие удаляет только то, что само загрузило раньше.
# .next/server — около 700 мелких файлов, меняющихся при каждой сборке, а FTP Hostland тратит на файл около секунды.
# Поэтому он идёт одним архивом server-update.tgz (curl), а обёртка hostland/server.js распаковывает его при запуске.
# После кода обновляется tmp/restart.txt — обёртка hostland/server.js замечает это и перезапускает приложение.

name: Deploy to Hostland

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostland
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      APP_DIR: ${{ vars.HOSTLAND_APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # NEXT_PUBLIC_* вшиваются в код при сборке, поэтому задаются переменными репозитория,
      # а не в .env на сервере. Пустые значения — берутся значения по умолчанию из lib/site.ts.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PAYMENTS_ENABLED: ${{ vars.NEXT_PUBLIC_PAYMENTS_ENABLED }}
          NEXT_PUBLIC_YANDEX_MAPS_KEY: ${{ vars.NEXT_PUBLIC_YANDEX_MAPS_KEY }}
          NEXT_PUBLIC_YM_ID: ${{ vars.NEXT_PUBLIC_YM_ID }}

      # standalone не копирует статику: кладём public и .next/static рядом с server.js
      - name: Assemble standalone
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # манифесты картинок читаются с диска — кладём явно, даже если трассировка их пропустит
          mkdir -p .next/standalone/data/media
          cp -r data/media/. .next/standalone/data/media/
          # на Hostland стартует обёртка hostland/server.js (https и продление SSL),
          # а сам сервер Next она подключает как next-server.js
          mv .next/standalone/server.js .next/standalone/next-server.js
          cp hostland/server.js .next/standalone/server.js
          # какой коммит сейчас на сайте: https://хочу-тент.рф/version.txt
          echo "${GITHUB_SHA::7} $(date -u +%FT%TZ)" > .next/standalone/public/version.txt
          mkdir -p restart
          date -u +%FT%TZ > restart/restart.txt
          # .next/server одним архивом (внутри папка server/)
          mkdir -p archive
          tar -czf archive/server-update.tgz -C .next/standalone/.next server
          ls -lh archive/server-update.tgz

      # Архив кладём первым: если выгрузка не прошла, живой сайт ещё не тронут.
      # Сначала файл .part, потом переименование — чтобы обёртка не подхватила недогруженный архив.
      - name: Upload .next/server archive via FTP
        if: env.FTP_PASSWORD != '' && env.APP_DIR != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          dir="${APP_DIR#./}"
          base="ftp://${FTP_SERVER}/${dir}"
          curl --fail --show-error --silent --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T archive/server-update.tgz "${base}server-update.tgz.part"
          curl --fail --show-error --silent --connect-timeout 30 --max-time 120 \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}" \
            -Q "RNFR ${dir}server-update.tgz.part" -Q "RNTO ${dir}server-update.tgz" -o /dev/null

      - name: Upload app via FTP (код)
        if: env.FTP_PASSWORD != '' && env.APP_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.next/standalone/
          server-dir: ${{ vars.HOSTLAND_APP_DIR }}
          # сервер отвечает медленно: на создание папки уходит несколько секунд
          timeout: 300000
          # по умолчанию действие пропускает node_modules, а standalone без них не запустится
          exclude: |
            **/.git*
            **/.git*/**
            public/products/**
            .next/server
            .next/server/**

      - name: Restart Passenger
        if: env.FTP_PASSWORD != '' && env.APP_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./restart/
          server-dir: ${{ vars.HOSTLAND_APP_DIR }}tmp/
          state-name: .ftp-deploy-restart.json

      - name: Upload product photos via FTP
        if: env.FTP_PASSWORD != '' && env.APP_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.next/standalone/public/products/
          server-dir: ${{ vars.HOSTLAND_APP_DIR }}public/products/
          # сервер отвечает медленно: на создание папки уходит несколько секунд
          timeout: 300000
          state-name: .ftp-deploy-products.json

      - name: Settings missing
        if: env.FTP_PASSWORD == '' || env.APP_DIR == ''
        run: echo "::warning::FTP-секреты или HOSTLAND_APP_DIR не заданы — сборка прошла, выгрузка пропущена."
